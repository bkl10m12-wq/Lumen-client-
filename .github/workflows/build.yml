
name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source zip
        run: unzip -q lumen-client-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build
        working-directory: lumen-client
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-client-jar
          path: |
            lumen-client/build/libs/*.jar
            !lumen-client/build/libs/*-sources.jar
